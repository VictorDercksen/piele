<button
  #trigger
  class="flag-trigger"
  type="button"
  [attr.aria-label]="triggerLabel()"
  [attr.aria-expanded]="open()"
  aria-controls="notifications-flag"
  (click)="toggle()"
>
  <svg class="flag-glyph" viewBox="0 0 40 40" fill="none" aria-hidden="true">
    <path d="M10 33V7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
    <path d="M12 8H32V24C25 27 20 21 12 24Z" fill="#14c8be" />
    <path d="M12 8H32L17 24L12 24Z" fill="#164551" />
    <path d="M23 8H28L13 24H12V21Z" fill="#79f2d2" />
  </svg>
  @if (unread()) {
    <span class="badge">{{ badge() }}</span>
  }
</button>
<div class="assembly">
  <div class="rod" aria-hidden="true"></div>
  <div class="swing">
    <section
      class="cloth"
      id="notifications-flag"
      aria-label="Notifications"
      [attr.aria-hidden]="!open()"
      [attr.inert]="open() ? null : ''"
    >
      <div class="fabric">
        <div class="fall-shading" aria-hidden="true"></div>
        <div class="stitch" aria-hidden="true"></div>
        <header>
          <img
            class="urc-logo"
            src="assets/images/urc-emblem.svg"
            alt="United Rugby Championship"
          />
          <button type="button" class="close" aria-label="Close notifications" (click)="close()">
            <app-icon name="close" />
          </button>
        </header>
        <div class="heading">
          <h2>Round {{ view.round().code }} updates.</h2>
          @if (unread()) {
            <button type="button" class="read" (click)="markAllRead()">Mark all read</button>
          }
        </div>
        <div class="list">
          @for (item of items(); track item.key) {
            <div
              class="notification-item"
              [class.spoon-duty]="item.spoon"
              [class.unread]="item.unread"
            >
              <app-icon [name]="item.icon" />
              <div>
                <h3>{{ item.title }}</h3>
                <p>{{ item.detail }}</p>
                <button type="button" class="text-button" (click)="go(item.path)">
                  {{ item.action }}<ng-icon class="link-icon" name="lucideArrowRight" />
                </button>
              </div>
            </div>
          }
        </div>
        <div class="caption">Piele / the rugby clubhouse</div>
      </div>
    </section>
    <div class="roll" aria-hidden="true"></div>
  </div>
</div>
<svg #ripple class="ripple-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter
    id="notifications-flag-ripple"
    x="-6%"
    y="-6%"
    width="112%"
    height="112%"
    color-interpolation-filters="sRGB"
  >
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.028" numOctaves="2" seed="7">
      <animate
        attributeName="baseFrequency"
        values="0.006 0.028;0.007 0.02;0.005 0.024;0.006 0.03"
        keyTimes="0;0.35;0.7;1"
        dur="1.45s"
        begin="indefinite"
        fill="freeze"
      />
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G">
      <animate
        attributeName="scale"
        values="6;30;24;14;7;3;0"
        keyTimes="0;0.2;0.42;0.6;0.76;0.9;1"
        dur="1.45s"
        begin="indefinite"
        fill="freeze"
      />
    </feDisplacementMap>
  </filter>
</svg>
