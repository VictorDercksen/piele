<dialog #dialog class="detail-dialog" aria-labelledby="notifications-title">
  <div class="dialog-top">
    <span class="eyebrow">PIELE / ROUND {{ view.round().code }}</span
    ><button type="button" class="icon-button" aria-label="Close dialog" (click)="close()">
      <app-icon name="close" />
    </button>
  </div>
  <h2 id="notifications-title">Round {{ view.round().code }} updates.</h2>
  <div class="notification-item">
    <app-icon name="rounds" />
    <div>
      <h3>{{ view.round().status }}</h3>
      <p>{{ view.activity() }}</p>
      <button type="button" class="text-button" (click)="go('/rounds')">
        View round fixtures →
      </button>
    </div>
  </div>
  @if (view.myDuty(); as duty) {
    <div class="notification-item" [class.spoon-duty]="duty.spoon">
      <app-icon name="duties" />
      <div>
        <h3>{{ duty.title }}</h3>
        <p>Due {{ duty.deadline }}</p>
        <button type="button" class="text-button" (click)="go('/duties')">View duty →</button>
      </div>
    </div>
  }
  @if (view.poll(); as poll) {
    <div class="notification-item">
      <app-icon name="decisions" />
      <div>
        <h3>{{ poll.question }}</h3>
        <p>{{ poll.status }} · {{ poll.closes }}</p>
        <button type="button" class="text-button" (click)="go('/decisions')">
          View decision →
        </button>
      </div>
    </div>
  }
</dialog>
