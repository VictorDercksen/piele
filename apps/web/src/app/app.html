@if (showProfile()) {
  <app-profile-editor (saved)="editProfile(false)" (cancel)="editProfile(false)" />
} @else {
  <a class="skip-link" href="#preview-main">Skip to clubhouse</a>
  <div class="prototype-bar">
    <span>PIELE / FLOODLIGHTS <small>Frontend preview · URC 2026/27</small></span
    ><label
      >View as
      <select
        #role
        [value]="captain() ? 'captain' : 'member'"
        (change)="captain.set(role.value === 'captain')"
      >
        <option value="member">Member</option>
        <option value="captain">Captain</option>
      </select></label
    >
  </div>
  <div class="application-preview">
    <app-league-preview
      [concept]="concept"
      [captain]="captain()"
      (editProfile)="editProfile(true)"
    />
  </div>
}
