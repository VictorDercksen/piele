<dialog
  #dialog
  class="detail-dialog compact-dialog"
  [class.spoon-duty]="request()?.spoon"
  aria-labelledby="reason-title"
  (close)="closed()"
>
  <div class="dialog-top">
    <span class="eyebrow">{{ request()?.eyebrow ?? leagueName().toUpperCase() + " / CAPTAIN'S DESK" }}</span
    ><button type="button" class="icon-button" aria-label="Close dialog" (click)="close()">
      <app-icon name="close" />
    </button>
  </div>
  <h2 id="reason-title">{{ request()?.title }}</h2>
  <p>{{ request()?.description }}</p>
  @if (!request()?.noReason) {
    <label class="field-label" for="reason-text"
      >Reason
      @if (!request()?.required) {
        <span>(optional)</span>
      }
    </label>
    <textarea
      #reasonInput
      id="reason-text"
      rows="3"
      maxlength="500"
      [formControl]="reason"
      [attr.aria-invalid]="invalid()"
    ></textarea>
  }
  <button
    type="button"
    class="primary-button wide"
    [disabled]="busy()"
    [attr.aria-busy]="busy()"
    (click)="submit()"
  >
    {{ request()?.submitLabel }}
    @if (busy()) {
      <app-loader [size]="18" aria-hidden="true" />
    } @else {
      <app-icon name="arrow" />
    }
  </button>
</dialog>
