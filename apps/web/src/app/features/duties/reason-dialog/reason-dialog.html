<hlm-dialog #dialog aria-labelledby="reason-title" (stateChanged)="dialogChanged($event)">
  <hlm-dialog-content
    *hlmDialogPortal
    [showCloseButton]="false"
    class="detail-dialog compact-dialog"
    [class.spoon-duty]="request()?.spoon"
  >
    <div class="dialog-top">
      <span class="eyebrow">{{
        request()?.eyebrow ?? leagueName().toUpperCase() + " / CAPTAIN'S DESK"
      }}</span
      ><button hlmBtn type="button" class="icon-button" aria-label="Close dialog" (click)="close()">
        <app-icon name="close" />
      </button>
    </div>
    <h2 id="reason-title">{{ request()?.title }}</h2>
    <p>{{ request()?.description }}</p>
    @if (!request()?.noReason) {
      <label hlmLabel class="field-label" for="reason-text"
        >Reason
        @if (!request()?.required) {
          <span>(optional)</span>
        }
      </label>
      <textarea
        hlmTextarea
        #reasonInput
        id="reason-text"
        rows="3"
        maxlength="500"
        [formControl]="reason"
        [aria-invalid]="invalid()"
      ></textarea>
    }
    <button
      hlmBtn
      type="button"
      class="primary-button wide"
      [disabled]="busy()"
      [attr.aria-busy]="busy()"
      (click)="submit()"
    >
      {{ request()?.submitLabel }}
      @if (busy()) {
        <app-loader [size]="18" aria-hidden="true" />
      } @else {
        <app-icon name="arrow" />
      }
    </button>
  </hlm-dialog-content>
</hlm-dialog>
