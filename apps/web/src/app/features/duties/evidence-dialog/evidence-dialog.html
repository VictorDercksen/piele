<hlm-dialog #dialog aria-labelledby="evidence-title" (stateChanged)="dialogChanged($event)">
  <hlm-dialog-content
    *hlmDialogPortal
    [showCloseButton]="false"
    class="detail-dialog compact-dialog evidence"
    [class.spoon-duty]="duty()?.spoon"
  >
    <div class="dialog-top">
      <span class="eyebrow">ROUND {{ view.round().code }} / {{ duty()?.memberName }}</span
      ><button hlmBtn type="button" class="icon-button" aria-label="Close dialog" (click)="close()">
        <app-icon name="close" />
      </button>
    </div>
    <h2 id="evidence-title">
      {{ onBehalf() ? 'Record the evidence.' : 'The proof is in the video.' }}
    </h2>
    <p>{{ duty()?.title }}</p>
    <label
      hlmLabel
      class="file-field"
      [class.filled]="file()"
      [class.invalid]="invalid() === 'file'"
    >
      <app-icon name="upload" />
      <strong>{{ file() ? 'Video chosen' : 'Choose the video' }}</strong>
      <span>{{ file()?.name || 'Up to 50 MB · visible to league members only' }}</span>
      <input
        hlmInput
        #fileInput
        type="file"
        accept="video/*"
        [aria-invalid]="invalid() === 'file'"
        (change)="pickFile($event)"
      />
    </label>
    @if (onBehalf()) {
      <label hlmLabel class="field-label" for="evidence-completed"
        >Completed at ({{ zoneName() }})</label
      >
      <input
        hlmInput
        #completedInput
        id="evidence-completed"
        class="text-input"
        type="datetime-local"
        [formControl]="completedAt"
        [aria-invalid]="invalid() === 'completed'"
      />
    }
    <label hlmLabel class="field-label" for="evidence-note">Note <span>(optional)</span></label>
    <textarea
      hlmTextarea
      id="evidence-note"
      rows="2"
      maxlength="500"
      placeholder="Anything the reviewer should know?"
      [formControl]="note"
    ></textarea>
    @if (view.sample) {
      <p class="context-note">Sample league. Your file is never uploaded or stored.</p>
    }
    <button
      hlmBtn
      type="button"
      class="primary-button wide"
      [disabled]="!file() || busy()"
      [attr.aria-busy]="busy()"
      (click)="submit()"
    >
      {{ onBehalf() ? 'Record evidence' : 'Submit evidence' }}
      @if (busy()) {
        <app-loader [size]="18" aria-hidden="true" />
      } @else {
        <app-icon name="arrow" />
      }
    </button>
  </hlm-dialog-content>
</hlm-dialog>
