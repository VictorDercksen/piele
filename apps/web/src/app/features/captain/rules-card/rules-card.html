<app-dropdown heading="Superbru rules." headingId="rules-heading">
  <p class="page-description">
    These mirror the pool's settings on Superbru and drive the scoring in the clubhouse.
  </p>
  <form class="rules-form" novalidate (submit)="submit($event)">
    <app-rules-fields
      idPrefix="rules"
      [group]="form"
      [lastRound]="lastRound()"
      [champions]="champions()"
      [submitted]="submitted()"
    />
    <div class="rules-actions">
      <button
        hlmBtn
        type="submit"
        class="primary-button"
        [disabled]="busy()"
        [attr.aria-busy]="busy()"
      >
        @if (busy()) {
          <app-loader [size]="16" aria-hidden="true" />
        }
        Save rules
      </button>
      @if (dirty()) {
        <button hlmBtn type="button" class="text-button" [disabled]="busy()" (click)="undo()">
          Undo changes
          <ng-icon class="link-icon" name="lucideRotateCcw" />
        </button>
      }
    </div>
  </form>
</app-dropdown>
