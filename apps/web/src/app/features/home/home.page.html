<div class="home-grid">
  @if (fixtures.featured(); as fixture) {
    <app-match-hero
      [fixture]="fixture"
      [favourite]="favouriteTeam()?.id ?? ''"
      [roundCode]="fixtures.round().code"
      [ruler]="ruler()"
      (explore)="go('/match/' + fixture.id)"
    />
  } @else {
    <section class="unscheduled-round">
      <span>ROUND {{ fixtures.round().code }} / COMING UP</span>
      <h2>The next chapter<br />is still being written.</h2>
      <p>Fixtures and dates have not been confirmed for this round.</p>
    </section>
  }
  <app-next-actions class="next-actions" (upload)="evidence().open($event)" />
  <aside appStandingsSummary class="standings-panel honours-board"></aside>
  <section class="club-feed"><app-feed /></section>
</div>
<app-evidence-dialog />
