[project]
name = "piele-api"
version = "0.1.0"
description = "Piele league administration API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "uvicorn==0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
